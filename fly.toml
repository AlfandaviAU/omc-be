# fly.toml app configuration file generated for omc-be on 2026-09-19T19:56:24+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'omc-be'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[mounts]
  source = "omc_data"
  destination = "/data"
